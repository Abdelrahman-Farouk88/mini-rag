services:
  mongodb:
    image: mongo:8.3.7-noble

    container_name: mongodb

    ports:
      - "27007:27017"

    volumes:
      - mongodb_data:/data/db
    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      

    networks:
      - backend

    restart: always

networks:
  backend:

volumes:
  mongodb_data: